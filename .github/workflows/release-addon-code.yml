name: Release addon on code change

# For a plain Core.lua fix that doesn't need a fresh data crawl at all —
# bumps the TOC version, zips the addon, and cuts a GitHub Release
# immediately, without touching Data.lua or WCL/Blizzard. The scheduled
# export-meta-builds workflow handles the "new data" release path; this one
# is just for shipping code fixes fast.
#
# Deliberately triggers on Core.lua only, not HotsBBTalents.toc — this
# workflow's own version-bump commit touches the TOC, and export-meta-builds
# does too, so triggering on TOC changes would risk this firing again off
# either workflow's own commit. Both commit messages also carry [skip ci],
# which GitHub itself honors to skip triggering any workflow for that push —
# the path filter is a second, redundant guard against the same loop.
on:
  push:
    branches: [main]
    paths:
      - 'addon/HotsBBTalents/Core.lua'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set addon version
        id: version
        run: |
          version="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed -i "s/^## Version:.*/## Version: $version/" addon/HotsBBTalents/HotsBBTalents.toc

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/HotsBBTalents/HotsBBTalents.toc
          git commit -m "Bump addon version to ${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Package addon zip
        run: |
          cd addon
          zip -r "../HotsBBTalents.zip" HotsBBTalents -x "*.git*"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            HotsBBTalents.zip \
            --title "HotsBB Talents v${{ steps.version.outputs.version }}" \
            --notes "Addon code update."
