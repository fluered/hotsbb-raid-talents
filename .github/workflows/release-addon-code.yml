name: Release addon on code change

# For a plain Core.lua fix that doesn't need a fresh data crawl at all —
# bumps the TOC version, zips the addon, and cuts a GitHub Release
# immediately, without touching Data.lua or WCL/Blizzard. The scheduled
# export-meta-builds workflow handles the "new data" release path; this one
# is just for shipping code fixes fast.
#
# Triggers on Core.lua or the TOC (e.g. a manual Interface-number bump for a new game
# patch). Both this workflow's own version-bump commit and export-meta-builds' commit
# also touch the TOC, which could otherwise re-trigger this on their own pushes — but
# both of those commit messages carry [skip ci], which GitHub honors globally to skip
# triggering any workflow for that push, so the loop never actually happens.
on:
  push:
    branches: [main]
    paths:
      - 'addon/HotsBBTalents/Core.lua'
      - 'addon/HotsBBTalents/HotsBBTalents.toc'
  workflow_dispatch: {} # manual "Run workflow" button, for cases like a workflow-definition
                        # change landing in the same push as the file change it's meant to catch —
                        # GitHub evaluates a push's trigger paths against the workflow as it
                        # existed *before* that push, so the first such change never fires itself

permissions:
  contents: write

# Serialize against the data-crawl workflow (same group name there): both push a TOC
# bump to main and cut a release, so running concurrently they could non-fast-forward
# each other's pushes or race on tags.
concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # First free vYYYY.MM.DD-N tag rather than github.run_number: run_number is a
      # per-workflow counter, so this workflow and export-meta-builds would eventually
      # mint the same tag on the same day and the second release would fail after its
      # push already landed. Scanning existing releases is collision-proof across both,
      # and makes failed runs re-runnable: a re-run just picks up where the last one
      # died (the bump commit diff is empty, the tag is still free).
      - name: Set addon version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(date -u +%Y.%m.%d)"
          n=1
          while gh release view "v$base-$n" >/dev/null 2>&1; do n=$((n+1)); done
          version="$base-$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed -i "s/^## Version:.*/## Version: $version/" addon/HotsBBTalents/HotsBBTalents.toc

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/HotsBBTalents/HotsBBTalents.toc
          # Empty diff happens on a re-run after a failed release step (the bump commit
          # already landed) — skip the commit and proceed straight to packaging.
          if ! git diff --cached --quiet; then
            git commit -m "Bump addon version to ${{ steps.version.outputs.version }} [skip ci]"
            # Main may have moved since checkout (user pushes) — rebase and retry so a
            # non-fast-forward rejection doesn't kill the release.
            for i in 1 2 3; do
              git push && break
              git pull --rebase origin main
            done
          fi

      - name: Package addon zip
        run: |
          cd addon
          zip -r "../HotsBBTalents.zip" HotsBBTalents -x "*.git*"

      - name: Write release.json
        run: |
          interface=$(grep -oP '^## Interface:\s*\K[0-9]+' addon/HotsBBTalents/HotsBBTalents.toc)
          cat > release.json <<EOF
          {
            "releases": [
              {
                "name": "HotsBB Talents",
                "version": "${{ steps.version.outputs.version }}",
                "filename": "HotsBBTalents.zip",
                "nolib": false,
                "metadata": [
                  { "flavor": "mainline", "interface": $interface }
                ]
              }
            ]
          }
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            HotsBBTalents.zip release.json \
            --title "HotsBB Talents v${{ steps.version.outputs.version }}" \
            --notes "Addon code update."
