name: Regenerate addon Data.lua and publish a release

# Runs the same batch export we used to run manually — hitting the live site's
# /api/meta-build across every class/spec x boss/dungeon combo and baking the
# result into addon/HotsBBTalents/Data.lua. Needs no secrets: WCL/Blizzard
# credentials already live server-side in Vercel and never touch this workflow.
#
# WCL's rate limiting can make a full run take anywhere from ~20 minutes to
# several hours. The export script has its own safety ceiling (currently 12h
# wall-clock / 9h cumulative rate-limit wait) and refuses to write a partial
# result if it's exceeded — so a run that gets throttled hard just fails
# cleanly and leaves Data.lua untouched, same as a manual run. The
# 350-minute job timeout below is a backstop for GitHub's own hard 6-hour
# per-job cap on hosted runners, not the primary safety mechanism.
#
# When Data.lua does change, also cuts a GitHub Release with a zipped addon
# folder attached — this is what WowUp (or any GitHub-release-tracking addon
# manager) picks up to auto-update guild members. No release goes out on a
# no-op or failed run, so players never get an update with stale/partial data.
on:
  schedule:
    # Tuesdays 22:00 UTC = 6pm ET during Daylight Time (drifts to 5pm ET during
    # Standard Time, Nov-Mar — cron has no DST awareness). Timed after WoW's
    # weekly Tuesday patch/reset so the crawl picks up whatever changed.
    - cron: '0 22 * * 2'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab, for off-cycle refreshes

permissions:
  contents: write

# Serialize against the fast-path code-release workflow (same group name there): both
# push a TOC bump to main and cut a release, so running concurrently they could
# non-fast-forward each other's pushes or race on tags.
concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run export
        run: node scripts/export-meta-builds.js

      # A plain `git diff --quiet` can never say "unchanged" here: the export embeds a
      # generation timestamp and per-combo fetchedAt values that are always fresh. Strip
      # those before comparing so a week where the meta genuinely didn't move skips the
      # release instead of pushing a pointless update to every WowUp user.
      - name: Check for changes
        id: check
        run: |
          normalize() { sed -e '/^-- Generated /d' -e 's/fetchedAt = [0-9]*,/fetchedAt = 0,/'; }
          if git diff --quiet -- addon/HotsBBTalents/Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to Data.lua — export produced identical data or made no progress."
          elif diff -q <(git show HEAD:addon/HotsBBTalents/Data.lua | normalize) <(normalize < addon/HotsBBTalents/Data.lua) >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Only timestamps changed — meta builds identical to last release; skipping."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # First free vYYYY.MM.DD-N tag rather than github.run_number: run_number is a
      # per-workflow counter, so this workflow and release-addon-code would eventually
      # mint the same tag on the same day and the second release would fail after its
      # push already landed. Scanning existing releases is collision-proof across both.
      - name: Set addon version
        if: steps.check.outputs.changed == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(date -u +%Y.%m.%d)"
          n=1
          while gh release view "v$base-$n" >/dev/null 2>&1; do n=$((n+1)); done
          version="$base-$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed -i "s/^## Version:.*/## Version: $version/" addon/HotsBBTalents/HotsBBTalents.toc

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/HotsBBTalents/Data.lua addon/HotsBBTalents/HotsBBTalents.toc
          git commit -m "Regenerate addon Data.lua (v${{ steps.version.outputs.version }}) [skip ci]"
          # A multi-hour crawl means main has often moved since checkout — rebase and
          # retry so a non-fast-forward rejection doesn't discard the whole run.
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin main
          done

      - name: Package addon zip
        if: steps.check.outputs.changed == 'true'
        run: |
          cd addon
          zip -r "../HotsBBTalents.zip" HotsBBTalents -x "*.git*"

      - name: Write release.json
        if: steps.check.outputs.changed == 'true'
        run: |
          interface=$(grep -oP '^## Interface:\s*\K[0-9]+' addon/HotsBBTalents/HotsBBTalents.toc)
          cat > release.json <<EOF
          {
            "releases": [
              {
                "name": "HotsBB Talents",
                "version": "${{ steps.version.outputs.version }}",
                "filename": "HotsBBTalents.zip",
                "nolib": false,
                "metadata": [
                  { "flavor": "mainline", "interface": $interface }
                ]
              }
            ]
          }
          EOF

      - name: Publish release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            HotsBBTalents.zip release.json \
            --title "HotsBB Talents v${{ steps.version.outputs.version }}" \
            --notes "Automated meta-build data refresh."
