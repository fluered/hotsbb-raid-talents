name: Regenerate addon Data.lua and publish a release

# Runs the same batch export we used to run manually — hitting the live site's
# /api/meta-build across every class/spec x boss/dungeon combo and baking the
# result into addon/HotsBBTalents/Data.lua. Needs no secrets: WCL/Blizzard
# credentials already live server-side in Vercel and never touch this workflow.
#
# WCL's rate limiting can make a full run take anywhere from ~20 minutes to
# several hours. The export script has its own safety ceiling (currently 12h
# wall-clock / 9h cumulative rate-limit wait) and refuses to write a partial
# result if it's exceeded — so a run that gets throttled hard just fails
# cleanly and leaves Data.lua untouched, same as a manual run. The
# 350-minute job timeout below is a backstop for GitHub's own hard 6-hour
# per-job cap on hosted runners, not the primary safety mechanism.
#
# When Data.lua does change, also cuts a GitHub Release with a zipped addon
# folder attached — this is what WowUp (or any GitHub-release-tracking addon
# manager) picks up to auto-update guild members. No release goes out on a
# no-op or failed run, so players never get an update with stale/partial data.
on:
  schedule:
    # Tuesdays 22:00 UTC = 6pm ET during Daylight Time (drifts to 5pm ET during
    # Standard Time, Nov-Mar — cron has no DST awareness). Timed after WoW's
    # weekly Tuesday patch/reset so the crawl picks up whatever changed.
    - cron: '0 22 * * 2'
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab, for off-cycle refreshes

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run export
        run: node scripts/export-meta-builds.js

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- addon/HotsBBTalents/Data.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to Data.lua — export produced identical data or made no progress."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set addon version
        if: steps.check.outputs.changed == 'true'
        id: version
        run: |
          version="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sed -i "s/^## Version:.*/## Version: $version/" addon/HotsBBTalents/HotsBBTalents.toc

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/HotsBBTalents/Data.lua addon/HotsBBTalents/HotsBBTalents.toc
          git commit -m "Regenerate addon Data.lua (v${{ steps.version.outputs.version }}) [skip ci]"
          git push

      - name: Package addon zip
        if: steps.check.outputs.changed == 'true'
        run: |
          cd addon
          zip -r "../HotsBBTalents.zip" HotsBBTalents -x "*.git*"

      - name: Publish release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            HotsBBTalents.zip \
            --title "HotsBB Talents v${{ steps.version.outputs.version }}" \
            --notes "Automated meta-build data refresh."
