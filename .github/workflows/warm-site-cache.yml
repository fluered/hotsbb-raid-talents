name: Warm site caches daily

# Runs the export sweep in --warm-only mode: every class/spec x boss/dungeon combo
# through the live site's /api/meta-build, which force-refreshes the shared Redis
# rankings entry (SWR v6) and warms telemetry + the entry->node map — so no visitor
# ever pays a cold or stale load. Data.lua and releases are untouched; that's the
# weekly export-meta-builds workflow's job.
#
# Cost check (2026-08-21, after the inline-talents change): a full sweep is roughly
# 1-2k WCL points against an 18k/hour budget, and typically ~30-60 min of wall clock.
#
# Deliberately NOT in the addon-release concurrency group: with cancel-in-progress
# false, a new pending run REPLACES the group's existing pending run — a warm firing
# while a release sat queued behind the 5h crawl would silently cancel that release.
# Solo group instead; the 07:00 UTC schedule (3am ET — dead of night for the guild,
# after the Tuesday 22:00 crawl has drained ~03:00) keeps it clear of everything.
concurrency:
  group: site-warm
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Warm every combo through the live site
        # Concurrency 3 (not the script's default 6): nothing is waiting on this run, so
        # halving the per-minute load on WCL and the site is free — ~45 min instead of ~25.
        run: node scripts/export-meta-builds.js --warm-only --concurrency 3
