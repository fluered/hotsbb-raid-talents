name: CI

# The checks every fix session used to re-run by hand before trusting the tree:
# TypeScript (the repo accumulated latent type errors twice with nothing guarding),
# addon Lua syntax (a non-parsing Data.lua bricks every WowUp user), the export
# script, and workflow YAML. No build, no deploys — Vercel owns those; this exists
# so a red X appears BEFORE a bad commit ships an addon release or breaks a crawl.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        # npm install, not ci: this lockfile provably installs on Linux (every Vercel
        # deploy does it) yet npm ci failed opaquely on the runner across npm 10 and
        # 11 — and CI exists for the checks below, not lockfile enforcement. On any
        # failure the npm debug log tail is emitted as an ::error:: annotation, which
        # IS readable through the public API (step logs are not).
        run: |
          npm install --no-audit --no-fund || {
            for f in /home/runner/.npm/_logs/*.log; do
              msg=$(tail -c 700 "$f" | tr -d '\r' | tr '\n' ' ')
              echo "::error title=npm install failed::$msg"
            done
            exit 1
          }
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Addon Lua syntax
        run: node scripts/check-lua.js
      - name: Export script syntax
        run: node --check scripts/export-meta-builds.js
      - name: Workflow YAML
        run: |
          node -e "
            const yaml = require('js-yaml'); const fs = require('fs');
            for (const f of fs.readdirSync('.github/workflows')) {
              yaml.load(fs.readFileSync('.github/workflows/' + f, 'utf8'));
              console.log('OK', f);
            }"
